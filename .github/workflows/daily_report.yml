name: Daily News Analysis

on:
  # 定时触发：UTC 6:30 = 北京时间 14:30
  schedule:
    - cron: "30 1 * * *"   # UTC 1:30 = 新加坡时间 9:00（你原来写的 6:30 是 UTC，对应新加坡 14:30，不是 9:00）
    - cron: "0 13 * * *"   # UTC 13:00 = 新加坡时间 21:00
  workflow_dispatch:

  # 手动触发
  # workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # ← 注意这里是6格缩进
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily analysis
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit and push generated data
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage generated report and token usage files
          git add data/reports/ data/token_usage/ --all
          git rm --cached data/reports/.gitkeep data/token_usage/.gitkeep 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            TODAY=$(date +%Y-%m-%d)
            git commit -m "Daily report: ${TODAY} [skip ci]"
            git push
          fi
