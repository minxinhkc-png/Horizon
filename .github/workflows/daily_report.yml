name: Daily News Analysis

on:
  schedule:
    # 提示：GitHub Actions 使用的是 UTC 时间（比新加坡/北京时间慢 8 小时）
    #- cron: "5 1 * * *"    # UTC 1:05 = 新加坡时间 09:05
    #- cron: "5 13 * * *"   # UTC 13:05 = 新加坡时间 21:05
    - cron: "25 23 * * *"   # UTC 20:05 前一天 = 新加坡时间 04:05，延迟~5h后约 09:05
    - cron: "55 8 * * *"    # UTC 8:05 = 新加坡时间 16:05，延迟~4h后约 21:05    
  
  workflow_dispatch:       # 保留手动触发按钮，方便你随时测试

  # 手动触发
  # workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # ← 注意这里是6格缩进
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure data directories exist
        run: |
          mkdir -p data/reports
          mkdir -p data/token_usage
          
      - name: Run daily analysis
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit and push generated data
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "=== Checking files ==="
          ls -la data/ || echo "data/ not found"
          ls -la data/reports/ || echo "data/reports/ not found"
          ls -la data/token_usage/ || echo "data/token_usage/ not found"
          echo "=== Git status ==="
          git status
          echo "=== Git check-ignore ==="
          git check-ignore -v data/reports/* data/token_usage/* || echo "No files ignored"
          git add -A data/reports/ data/token_usage/
          echo "=== Git status after add ==="
          git status
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            TODAY=$(date +%Y-%m-%d)
            git commit -m "Daily report: ${TODAY} [skip ci]"
            git pull --rebase origin master
            git push
          fi
