# 抓取配置
fetch_settings:
  # 只抓取最近 N 小时内的新闻
  time_window_hours: 24
  # 每个源最多抓取条数
  max_entries_per_source: 30
  # 全局去重（基于 title+link hash）
  deduplication: true
  # 抓取超时（秒）
  timeout: 30
  # 单个源失败后是否继续抓取其他源
  continue_on_error: true
