# 新闻源配置
# 国际源（英文）侧重全球宏观经济与美股市场
# 国内源（中文）侧重A股、港股及中国产业政策

international:
  - name: Reuters Business
    url: https://feeds.reuters.com/reuters/businessNews
    category: finance
    language: en

  - name: Reuters Markets
    url: https://feeds.reuters.com/reuters/marketsNews
    category: market
    language: en

  - name: Reuters Technology
    url: https://feeds.reuters.com/reuters/technologyNews
    category: tech
    language: en

  - name: CNBC Top News
    url: https://www.cnbc.com/id/100003114/device/rss/rss.html
    category: finance
    language: en

  - name: CNBC Markets
    url: https://www.cnbc.com/id/10001147/device/rss/rss.html
    category: market
    language: en

  - name: WSJ Markets
    url: https://feeds.content.dowjonesonline.com/RSSMarketsMain.xml
    category: market
    language: en

  - name: Yahoo Finance
    url: https://finance.yahoo.com/news/rssindex
    category: finance
    language: en

  - name: Seeking Alpha
    url: https://seekingalpha.com/market_currents.xml
    category: market
    language: en

domestic:
  - name: 36氪
    url: https://36kr.com/feed
    category: tech_finance
    language: zh

  - name: 新浪财经
    url: https://finance.sina.com.cn/7x24/7x24.xml
