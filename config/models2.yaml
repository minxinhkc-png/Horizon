# LLM 模型配置

deepseek:
  # DeepSeek API 基础地址（OpenAI兼容格式）
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # 模型名称
  model: deepseek-v4-flash
  # 最大输出 token 数
  max_tokens: 4096
  # 温度参数（越低越确定性，适合分析任务）
  temperature: 0.3
  # 是否启用 JSON mode 输出
  json_mode: true

# Token 计费配置（DeepSeek-V3 定价）
pricing:
  # 输入 token 价格（美元/百万token）
  input_per_million: 0.27
  # 缓存输入 token 价格
  cached_input_per_million: 0.07
  # 输出 token 价格
  output_per_million: 1.10

# Prompt 模板
prompts:

  # =========================
  # STEP 1: 新闻摘要提炼
  # =========================
  summary: |
    你是一位资深宏观与市场分析师。

    请阅读以下今日财经新闻合集，并提炼出最重要的5-10条核心信息。

    分析要求：
    1. 每条摘要控制在50-100字
    2. 按重要性从高到低排序
    3. 必须突出“对市场有直接影响”的信息
    4. 分类必须明确：
       - macro（宏观政策 / 利率 / 通胀 / 地缘政治）
       - industry（行业趋势 / 技术变化 / 产业链）
       - company（公司财报 / 并购 / 指引 / 产品）
    5. 避免重复新闻或低信息密度内容

    输出要求（严格JSON）：
    {{
      "summaries": [
        {{
          "title": "标题",
          "content": "摘要内容",
          "category": "macro|industry|company",
          "importance": 1-5
        }}
      ]
    }}

    今日新闻合集：
    {news_content}


  # =========================
  # STEP 2: 市场影响分析
  # =========================
  market_impact: |
    你是一位专业级全球市场策略分析师。

    基于以下新闻摘要，判断对全球市场的影响。

    分析框架：
    1. 美股整体趋势判断（看涨/看跌/中性）
    2. A股整体趋势判断（看涨/看跌/中性）
    3. 逻辑必须基于：
       - 流动性（利率 / 美债 / 美元）
       - 风险偏好（risk-on / risk-off）
       - 行业驱动（AI / 能源 / 消费 / 金融）
    4. 必须给出置信度（0-100）

    行业分析要求：
    - 列出3-5个利多行业
    - 列出3-5个利空行业
    - 每个行业必须说明驱动逻辑（不能只写名称）

    输出要求（严格JSON）：
    {{
      "us_market": {{
        "trend": "bullish|bearish|neutral",
        "confidence": 0-100,
        "reasons": ["原因1", "原因2"]
      }},
      "cn_market": {{
        "trend": "bullish|bearish|neutral",
        "confidence": 0-100,
        "reasons": ["原因1", "原因2"]
      }},
      "bullish_sectors": [
        {{
          "sector": "行业名称",
          "reason": "受益逻辑"
        }}
      ],
      "bearish_sectors": [
        {{
          "sector": "行业名称",
          "reason": "受损逻辑"
        }}
      ]
    }}

    今日新闻摘要：
    {summaries}


  # =========================
  # STEP 3: 个股映射与交易标的生成
  # =========================
  stock_pick: |
    你是一位机构级投资顾问与量化策略分析师。

    基于以下信息推导受影响的具体个股：

    输入包括：
    - 今日新闻摘要
    - 市场影响分析

    分析要求：
    1. 每只个股必须有“明确传导逻辑”（禁止无依据推荐）
    2. 必须区分美股与A股
    3. 每只股票需标注：
       - direction（bullish / bearish）
       - confidence（0-100）
    4. 优先选择：
       - 行业龙头
       - 直接受新闻影响的公司
       - 产业链核心节点
    5. A股必须写：名称 + 股票代码
    6. 美股必须写：ticker + 公司名

    逻辑要求：
    - 必须体现“新闻 → 行业 → 公司”的链路
    - 禁止纯猜测或无关联推荐

    输出要求（严格JSON）：
    {{
      "us_stocks": [
        {{
          "symbol": "AAPL",
          "name": "Apple Inc.",
          "direction": "bullish|bearish",
          "confidence": 0-100,
          "reason": "新闻 → 行业 → 公司传导逻辑"
        }}
      ],
      "cn_stocks": [
        {{
          "symbol": "600519",
          "name": "贵州茅台",
          "direction": "bullish|bearish",
          "confidence": 0-100,
          "reason": "新闻 → 行业 → 公司传导逻辑"
        }}
      ]
    }}

    今日新闻摘要：
    {summaries}

    市场影响分析：
    {market_impact}
